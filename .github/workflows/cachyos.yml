name: Cachy-OS/ryzen Compile Optimized Zen Browser

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    name: Build Zen (${{ matrix.target_name }})
    # Use GitHub's free cloud infrastructure
    runs-on: ubuntu-24.04
    
    # Isolate the entire build environment inside a rolling-release CachyOS container
    container:
      image: cachyos/cachyos:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: "CachyOS-Ryzen-5900-znver3"
            march_flag: "znver3"
            mtune_flag: "znver3"
            cflags_extra: "-O3 -flto=thin -fno-plt -pipe"

    steps:
      - name: System Dependencies & Toolchain (CachyOS Pacman)
        run: |
          # Sync rolling-release mirrors and install compilation requirements natively
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git curl python nodejs npm yasm \
            alsa-lib dbus glib2 gtk3 libpulse libx11 libxt mesa clamav

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install Native Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"

      - name: Setup Node Package Manager (pnpm)
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Node Dependencies
        run: |
          echo "block-exotic-subdeps=true" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc
          pnpm install --no-frozen-lockfile

      - name: Initialize Browser Engine
        run: pnpm run init

      - name: Inject Ryzen 5900 (Zen 3) Optimization Environment
        env:
          MARCH: ${{ matrix.march_flag }}
          MTUNE: ${{ matrix.mtune_flag }}
          EXTRA_FLAGS: ${{ matrix.cflags_extra }}
        run: |
          MOZCONFIG_PATH="configs/linux/mozconfig"
          
          if [ -f "$MOZCONFIG_PATH" ]; then
            echo "Injecting targeted compiler variables into $MOZCONFIG_PATH..."
            BUILD_CFLAGS="-march=${MARCH} -mtune=${MTUNE} ${EXTRA_FLAGS}"
            
            echo "export CFLAGS=\"\$CFLAGS ${BUILD_CFLAGS}\"" >> "$MOZCONFIG_PATH"
            echo "export CXXFLAGS=\"\$CXXFLAGS ${BUILD_CFLAGS}\"" >> "$MOZCONFIG_PATH"
            
            if [[ "${EXTRA_FLAGS}" == *"-flto"* ]]; then
              echo "export RUSTFLAGS=\"\$RUSTFLAGS -C linker-plugin-lto -C target-cpu=${MARCH}\"" >> "$MOZCONFIG_PATH"
            fi
            
            cat "$MOZCONFIG_PATH"
          else
            echo "ac_add_options --enable-optimize=\"-march=${MARCH} -mtune=${MTUNE} ${EXTRA_FLAGS}\"" >> .mozconfig
          fi

      - name: Compile Zen Browser
        run: pnpm run build

      - name: Package Output Binaries
        run: |
          mkdir -p final-artifacts
          find dist/ firefox-dev/ obj-*/dist/ -name "zen*.tar.xz" -o -name "zen*.tar.bz2" -exec cp {} final-artifacts/ \; || true

      - name: Upload Native CachyOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zen-Browser-${{ matrix.target_name }}
          path: final-artifacts/
          if-no-files-found: warn
