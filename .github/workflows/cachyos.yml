name: Compile Optimized Zen Browser

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Zen (${{ matrix.target_name }})
    runs-on: ubuntu-24.04
    # Run everything inside a modern Arch-based container for glibc and toolchain matching
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: "CachyOS-Ryzen-5900-znver3"
            march_flag: "znver3"
            mtune_flag: "znver3"
            cflags_extra: "-O3 -flto=thin -fno-plt -pipe"

    steps:
      - name: Initialize Arch/CachyOS Toolchain & System Dependencies
        run: |
          # Update repositories and install foundational Arch build packages
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git curl python nodejs npm yasm \
            alsa-lib dbus glib2 gtk3 libpulse libx11 libxt mesa clamav

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install Rust (via rustup for Arch compatibility)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          # Ensure environment updates immediately for subsequent steps
          export PATH="$HOME/.cargo/bin:$PATH"

      - name: Install Corepack & pnpm
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Node Dependencies
        run: |
          echo "block-exotic-subdeps=true" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc
          pnpm install --no-frozen-lockfile

      - name: Initialize & Bootstrap Browser Engine
        run: pnpm run init

      - name: Inject CachyOS & Ryzen 5900 Compiler Optimizations
        env:
          MARCH: ${{ matrix.march_flag }}
          MTUNE: ${{ matrix.mtune_flag }}
          EXTRA_FLAGS: ${{ matrix.cflags_extra }}
        run: |
          MOZCONFIG_PATH="configs/linux/mozconfig"
          
          if [ -f "$MOZCONFIG_PATH" ]; then
            echo "Injecting target microarchitecture flags into $MOZCONFIG_PATH..."
            
            # Using ThinLTO (-flto=thin) which works remarkably well with modern Clang/GCC on Zen 3
            BUILD_CFLAGS="-march=${MARCH} -mtune=${MTUNE} ${EXTRA_FLAGS}"
            
            echo "export CFLAGS=\"\$CFLAGS ${BUILD_CFLAGS}\"" >> "$MOZCONFIG_PATH"
            echo "export CXXFLAGS=\"\$CXXFLAGS ${BUILD_CFLAGS}\"" >> "$MOZCONFIG_PATH"
            
            if [[ "${EXTRA_FLAGS}" == *"-flto"* ]]; then
              echo "export RUSTFLAGS=\"\$RUSTFLAGS -C linker-plugin-lto -C target-cpu=${MARCH}\"" >> "$MOZCONFIG_PATH"
            fi
            
            echo "--- Modified Mozconfig ---"
            cat "$MOZCONFIG_PATH"
          else
            echo "ac_add_options --enable-optimize=\"-march=${MARCH} -mtune=${MTUNE} ${EXTRA_FLAGS}\"" >> .mozconfig
          fi

      - name: Compile Zen Browser
        run: pnpm run build

      - name: Package Output
        run: |
          mkdir -p final-artifacts
          find dist/ firefox-dev/ obj-*/dist/ -name "zen*.tar.xz" -o -name "zen*.tar.bz2" -exec cp {} final-artifacts/ \; || true

      - name: Upload Optimized Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zen-Browser-${{ matrix.target_name }}
          path: final-artifacts/
          if-no-files-found: warn
